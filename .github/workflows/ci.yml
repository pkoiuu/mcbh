# CI 编译验证 — 每次 push/PR 自动验证编译
# 优化: 并行 install/restore + 多进程编译 + 条件打包 + 7z 压缩
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            src/Baihe.UI/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/Baihe.UI/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 并行: pnpm install (后台) + dotnet restore (前台)
      # 节省约 15s — 两个独立操作重叠执行
      - name: Install frontend deps + restore backend (parallel)
        shell: pwsh
        run: |
          Write-Host '=== Starting parallel pnpm install + dotnet restore ==='
          $pnpm = Start-Process pnpm -ArgumentList 'install --frozen-lockfile --prefer-offline' `
            -WorkingDirectory "$PWD/src/Baihe.UI" -NoNewWindow -PassThru `
            -RedirectStandardOutput 'pnpm-install.log' -RedirectStandardError 'pnpm-install-error.log'

          dotnet restore src/Baihe.Host/Baihe.Host.csproj

          $pnpm.WaitForExit()
          Write-Host '--- pnpm install output ---'
          if (Test-Path pnpm-install.log) { Get-Content pnpm-install.log }
          if (Test-Path pnpm-install-error.log) { Get-Content pnpm-install-error.log }
          if ($pnpm.ExitCode -ne 0) {
            Write-Host "pnpm install failed with exit code $($pnpm.ExitCode)"
            exit 1
          }
          Write-Host '=== Parallel phase complete ==='

      - name: Build frontend
        working-directory: src/Baihe.UI
        run: pnpm build

      # -m: MSBuild 多进程编译 (利用多核)
      # --no-restore: 跳过冗余 restore (已在上方完成)
      - name: Build backend (parallel MSBuild)
        run: dotnet build src/Baihe.Host/Baihe.Host.csproj -c Release -m --no-restore

      # 在线版安装器编译验证 (net48 WinForms)
      - name: Build online installer
        run: dotnet build src/Baihe.OnlineInstaller/Baihe.OnlineInstaller.csproj -c Release --nologo

      # 仅 main 分支 push 时打包 + 发布 (PR 跳过，节省约 80s)
      - name: Package build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host '=== Compressing build with 7z (fast mode) ==='
          & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=1 baihe-build.zip `
            'src/Baihe.Host/bin/Release/net10.0-windows/win-x64/*'

      - name: Update latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建
          body: |
            自动构建 - ${{ github.event.head_commit.message }}
            构建时间: ${{ github.event.head_commit.timestamp }}
            提交: ${{ github.sha }}
          prerelease: true
          files: baihe-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
