# 官方网站部署 — 推送到 main 后自动发布到 GitHub Pages
# 部署内容:
#   /        ← site/（官网首页）
#   /wiki/   ← wiki-site/index.html（网页版维基）+ 仓库根 wiki.json（远程数据源）
#   news.json ← 仓库根公告（与启动器首页共用同一数据源）
# 启用方式: 仓库 Settings → Pages → Source 选择 "GitHub Actions"（本 workflow 自动接管）
name: Deploy Official Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wiki-site/**'
      - 'wiki.json'
      - 'news.json'
      - 'src/Baihe.UI/src/lib/wiki/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/wiki
          # 官网 → 站点根
          cp -r site/. deploy/
          # 网页版维基 → /wiki/
          cp wiki-site/index.html deploy/wiki/index.html
          cp wiki.json deploy/wiki/wiki.json
          # 公告数据源 → 站点根（官网 fetch ./news.json；启动器同样拉仓库根这份）
          cp news.json deploy/news.json
          ls -laR deploy | head -60

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
