# 网页版维基部署 — 推送到 main 后自动发布到 GitHub Pages
# 部署内容: wiki-site/（单页应用）+ 仓库根 wiki.json（复制进部署目录，作为远程数据源）
# 启用方式: 仓库 Settings → Pages → Source 选择 "GitHub Actions"（本 workflow 自动接管）
name: Wiki Pages

on:
  push:
    branches: [main]
    paths:
      - 'wiki-site/**'
      - 'wiki.json'
      - 'src/Baihe.UI/src/lib/wiki/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          # wiki.json 复制进部署目录（网页版维基的远程数据源）
          cp wiki.json wiki-site/wiki.json
          ls -la wiki-site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
