# Release 构建 — 打 tag v* 自动构建完整安装包并发布到 GitHub Releases
# 产出: 开箱即用的 EXE 安装包，包含启动器 + JRE 21 + WebView2 + .minecraft 全量游戏文件
# 优化: 并行准备阶段 (前端+JRE+WebView2+.minecraft+NuGet restore) + 多进程发布
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  release:
    # 守卫: 测试 tag（vX.Y.Z-testN）由 test-release.yml 处理，此处跳过避免双流水线重复跑
    if: ${{ !contains(github.ref_name, '-test') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            src/Baihe.UI/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/Baihe.UI/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ===== 并行准备阶段: 前端 + JRE + WebView2 + .minecraft + NuGet restore + 在线安装器 =====
      # 六个独立操作同时执行，原串行约 215s，并行后约 120s (节省 ~95s)
      - name: Parallel preparation (frontend + JRE + WebView2 + .minecraft + restore + online installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAIHE_ONLINE_TOKEN: ${{ secrets.BAIHE_ONLINE_TOKEN }}
        run: |
          Write-Host '=== Starting parallel preparation phase ==='
          New-Item -ItemType Directory -Path 'dist\launcher' -Force | Out-Null

          # 1. JRE 构建 (后台, 约 30-60s)
          $jreJob = Start-Job -ScriptBlock {
            param($javaHome, $workDir)
            $env:JAVA_HOME = $javaHome
            Set-Location $workDir
            $jmods = "$env:JAVA_HOME\jmods"
            jlink --module-path $jmods `
              --add-modules java.base,java.compiler,java.desktop,java.management,java.net.http,java.naming,java.scripting,java.sql,java.xml,java.logging,java.security.sasl,java.transaction.xa,java.instrument,java.prefs,java.rmi,java.security.jgss,jdk.crypto.ec,jdk.zipfs,jdk.management,jdk.unsupported `
              --output dist\launcher\jre `
              --strip-debug --no-man-pages --no-header-files --compress=2 2>&1
          } -ArgumentList $env:JAVA_HOME, $PWD

          # 2. WebView2 下载 (后台, 约 10-20s)
          $wv2Job = Start-Job -ScriptBlock {
            param($workDir)
            Set-Location $workDir
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124702" `
              -OutFile "dist\launcher\MicrosoftEdgeWebView2RuntimeInstallerX64.exe" 2>&1
          } -ArgumentList $PWD

          # 3. .minecraft 下载+解压 (后台, 约 60-120s)
          $mcJob = Start-Job -ScriptBlock {
            param($workDir, $ghToken)
            $env:GH_TOKEN = $ghToken
            Set-Location $workDir
            gh release download v1.0-assets --pattern "minecraft.7z" --output minecraft.7z --clobber 2>&1
            7z x minecraft.7z -odist\ -y 2>&1
            Remove-Item minecraft.7z 2>&1
          } -ArgumentList $PWD, $env:GH_TOKEN

          # 4. NuGet restore (后台, 约 15-30s, 不依赖 wwwroot)
          # 注: 必须与 publish 使用相同的属性 (PublishReadyToRun=true)，否则 R2R 运行时包未还原导致 NETSDK1094
          $restoreJob = Start-Job -ScriptBlock {
            param($workDir)
            Set-Location $workDir
            dotnet restore src/Baihe.Host/Baihe.Host.csproj -p:PublishReadyToRun=true 2>&1
          } -ArgumentList $PWD

          # 5. 在线安装器构建 (后台, 约 15-30s, net48 独立项目) — 并入并行阶段省串行时间
          # 自建加速服务令牌从 secrets 注入（源码不含令牌）
          $onlineJob = Start-Job -ScriptBlock {
            param($workDir, $onlineToken)
            Set-Location $workDir
            if (-not [string]::IsNullOrEmpty($onlineToken)) {
              dotnet publish src/Baihe.OnlineInstaller/Baihe.OnlineInstaller.csproj -c Release -o dist\online --nologo -p:OnlineToken=$onlineToken 2>&1
            } else {
              dotnet publish src/Baihe.OnlineInstaller/Baihe.OnlineInstaller.csproj -c Release -o dist\online --nologo 2>&1
            }
          } -ArgumentList $PWD, $env:BAIHE_ONLINE_TOKEN

          # 6. 前端构建 (前台, 约 15s)
          Write-Host '--- Building frontend ---'
          Set-Location src/Baihe.UI
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build
          Set-Location ../..

          # 等待所有后台任务
          Write-Host '--- Waiting for background jobs ---'
          $jobs = @($jreJob, $wv2Job, $mcJob, $restoreJob, $onlineJob)
          Wait-Job -Job $jobs

          # 检查结果并输出日志
          foreach ($job in $jobs) {
            $name = switch ($job.Id) {
              $jreJob.Id      { 'JRE build' }
              $wv2Job.Id      { 'WebView2 download' }
              $mcJob.Id       { '.minecraft download' }
              $restoreJob.Id  { 'NuGet restore' }
              $onlineJob.Id   { 'Online installer build' }
              default         { 'Unknown' }
            }
            Write-Host "--- $name output ---"
            Receive-Job $job | ForEach-Object { Write-Host $_ }
            if ($job.State -eq 'Failed') {
              throw "$name failed"
            }
            Remove-Job $job -Force
          }
          Write-Host '=== Parallel preparation complete ==='

      # ===== 发布后端 (多进程编译, 跳过冗余 restore) =====
      - name: Publish Baihe.Host
        env:
          BAIHE_ONLINE_TOKEN: ${{ secrets.BAIHE_ONLINE_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Publishing version: $version"
          if (-not [string]::IsNullOrEmpty($env:BAIHE_ONLINE_TOKEN)) {
            dotnet publish src/Baihe.Host/Baihe.Host.csproj `
              -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=false `
              -p:PublishReadyToRun=true `
              -p:PublishTrimmed=false `
              -p:AssemblyVersion=$version `
              -p:FileVersion=$version `
              -p:OnlineToken=$env:BAIHE_ONLINE_TOKEN `
              -o dist\launcher -m --no-restore
          } else {
            dotnet publish src/Baihe.Host/Baihe.Host.csproj `
              -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=false `
              -p:PublishReadyToRun=true `
              -p:PublishTrimmed=false `
              -p:AssemblyVersion=$version `
              -p:FileVersion=$version `
              -o dist\launcher -m --no-restore
          }

      # ===== 复制附加资源 =====
      - name: Copy installer resources
        run: |
          Copy-Item installer_resources\icon.ico dist\launcher\ -Force
          Copy-Item fabric-installer.jar dist\launcher\ -Force

      # ===== 增量更新支持：清单(必产) + 相对上一正式版的差量补丁(可能跳过) =====
      # 上一版检索范围 = 非预发布;失败仅告警,不影响本安装包发布
      - name: Generate update manifest & patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path .temp | Out-Null
          $pm = $null
          try {
            $rels = gh api 'repos/pkoiuu/mcbh/releases?per_page=30' --jq '.[] | select(.draft == false)' | ConvertFrom-Json
            foreach ($r in @($rels)) {
              if ($r.prerelease -eq $true) { continue }
              if ($r.tag_name -eq "${{ github.ref_name }}") { continue }
              $hasM = @($r.assets | Where-Object { $_.name -like 'BaiheManifest_*.json' }).Count -gt 0
              if (-not $hasM) { continue }
              Write-Host "Prev stable manifest found on: $($r.tag_name)"
              gh release download $r.tag_name --pattern 'BaiheManifest_*.json' --dir .temp --clobber
              $pm = Get-ChildItem .temp -Filter 'BaiheManifest_*.json' | Select-Object -First 1
              break
            }
          } catch { Write-Host "WARN: search prev releases failed: $_" }
          if (-not $pm) { Write-Host 'No prev stable manifest -> this release produces manifest only (incremental starts next release)' }
          Remove-Item -Recurse -Force .temp\patch_stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .temp\patch_stage | Out-Null
          Copy-Item dist\launcher\* .temp\patch_stage\ -Recurse -Force
          if (Test-Path dist\.minecraft) { Copy-Item dist\.minecraft .temp\patch_stage\.minecraft -Recurse -Force }
          $genArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/generate-update-patch.ps1',
            '-CurrentDir', '.temp/patch_stage',
            '-Version', $tagNoV,
            '-OutputDir', 'dist'
          )
          if ($pm) { $genArgs += @('-PrevManifestPath', $pm.FullName) }
          & pwsh @genArgs
          Write-Host "generate-update-patch exit code: $($LASTEXITCODE) (0=patch produced, 2=manifest-only)"
          Remove-Item -Recurse -Force .temp\patch_stage -ErrorAction SilentlyContinue

      # ===== 验证打包内容完整性 (信息性，不阻断构建) =====
      - name: Verify package contents
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== dist\launcher ==="
          if (Test-Path dist\launcher) { Get-ChildItem dist\launcher -File | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,0)}} }
          Write-Host "`n=== dist\launcher\jre\bin ==="
          if (Test-Path dist\launcher\jre\bin) { Get-ChildItem dist\launcher\jre\bin -File | Select-Object Name }
          Write-Host "`n=== dist\launcher\wwwroot ==="
          if (Test-Path dist\launcher\wwwroot) { Get-ChildItem dist\launcher\wwwroot -File | Select-Object Name }
          Write-Host "`n=== dist\.minecraft ==="
          if (Test-Path dist\.minecraft) { Get-ChildItem dist\.minecraft -Directory | Select-Object Name }
          Write-Host "`n=== .minecraft\versions ==="
          if (Test-Path dist\.minecraft\versions) { Get-ChildItem dist\.minecraft\versions -Directory | Select-Object Name }
          Write-Host "`n=== .minecraft\mods ==="
          if (Test-Path dist\.minecraft\mods) { Get-ChildItem dist\.minecraft\mods -File | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,0)}} }
          Write-Host "`n=== .minecraft\.fabric ==="
          if (Test-Path dist\.minecraft\.fabric) { Write-Host "Fabric cache: EXISTS" } else { Write-Host "Fabric cache: MISSING!" }
          Write-Host "`n=== .minecraft\assets\objects count ==="
          if (Test-Path dist\.minecraft\assets\objects) { (Get-ChildItem dist\.minecraft\assets\objects -Recurse -File).Count } else { Write-Host "assets/objects: MISSING!" }

      # ===== 编译 Inno Setup 安装包 =====
      - name: Build installer with Inno Setup
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Building installer version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer\baihe_installer.iss

      # ===== 在线安装器命名（已在并行阶段构建到 dist\online）=====
      - name: Name online installer artifact
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Copy-Item dist\online\BaiheOnlineSetup.exe "dist\BaiheOnlineSetup_v$version.exe" -Force
          Get-ChildItem dist\BaiheOnlineSetup_v$version.exe | Select-Object Name, @{N='SizeKB';E={[math]::Round($_.Length/1KB,1)}}

      # ===== 上传到 GitHub Releases =====
      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BaiheServer_Setup_*.exe
            dist/BaiheOnlineSetup_v*.exe
            dist/BaiheManifest_v*.json
            dist/BaihePatch_v*.zip
          generate_release_notes: true
          body: |
            ## 白鹤服务器启动器 v${{ github.ref_name }}

            ### 包含内容
            - 白鹤启动器主程序 (自包含 .NET 10 运行时)
            - Java 21 JRE (20 模块，jlink 最小化构建，含 java.compiler + jdk.unsupported)
            - WebView2 Runtime 离线安装程序
            - Minecraft 1.21.8 + Fabric Loader (最新稳定版)
            - 13 个预装模组 (钠、玉、苹果皮、Xaero小地图、Iris、IMBlocker 等)
            - 4 个预装光影包 (Complementary、BSL、Sildur's、MakeUp)
            - 3985+ 个资源文件 (assets/objects)
            - 113 个库文件 (含原生库)
            - 全量模组配置文件

            ### 系统要求
            - Windows 10 64 位或更高
            - 无需预装 Java 或 .NET
            - 无需管理员权限

            ### 安装说明
            下载 EXE 安装包，双击运行即可。安装程序会自动:
            1. 安装到用户目录 (%LOCALAPPDATA%\BaiheServer)
            2. 检测并安装 WebView2 Runtime (如未安装)
            3. 创建桌面和开始菜单快捷方式
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
