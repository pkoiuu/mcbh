# 测试版发布构建 — 推送形如 vX.Y.Z-test<N> 的标签（如 v1.1.26-test1）自动云打包并发布为「预发布 Release」
# 关键机制: GitHub /releases/latest 端点天然排除预发布 —— 主程序自动更新与正式在线安装器
#           均查询该端点，因此测试包对稳定通道完全不可见，玩家侧零影响。
# 版本号映射: tag v1.1.26-test1 → 资产 BaiheServer_Setup_v1.1.26-test1.exe
#            FileVersion = 基础版.序号 = 1.1.26.1（纯数字四段，test 包之间可比）
# 注意: 需要同时存在同族测试完整包后，测试在线安装器才能拉到对应版本（拉不到会明确报错而非错拉稳定包）
name: Test Release

on:
  push:
    tags:
      - 'v*-test*'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            src/Baihe.UI/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('src/Baihe.UI/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ===== 并行准备阶段（与正式 Release 相同的六路并行）=====
      - name: Parallel preparation (frontend + JRE + WebView2 + .minecraft + restore + online installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAIHE_ONLINE_TOKEN: ${{ secrets.BAIHE_ONLINE_TOKEN }}
        run: |
          Write-Host '=== Test Release: starting parallel preparation ==='
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Building TEST build from tag: $tagNoV"
          New-Item -ItemType Directory -Path 'dist\launcher' -Force | Out-Null

          # 1. JRE 构建 (后台)
          $jreJob = Start-Job -ScriptBlock {
            param($javaHome, $workDir)
            $env:JAVA_HOME = $javaHome
            Set-Location $workDir
            $jmods = "$env:JAVA_HOME\jmods"
            jlink --module-path $jmods `
              --add-modules java.base,java.compiler,java.desktop,java.management,java.net.http,java.naming,java.scripting,java.sql,java.xml,java.logging,java.security.sasl,java.transaction.xa,java.instrument,java.prefs,java.rmi,java.security.jgss,jdk.crypto.ec,jdk.zipfs,jdk.management,jdk.unsupported `
              --output dist\launcher\jre `
              --strip-debug --no-man-pages --no-header-files --compress=2 2>&1
          } -ArgumentList $env:JAVA_HOME, $PWD

          # 2. WebView2 下载 (后台)
          $wv2Job = Start-Job -ScriptBlock {
            param($workDir)
            Set-Location $workDir
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124702" `
              -OutFile "dist\launcher\MicrosoftEdgeWebView2RuntimeInstallerX64.exe" 2>&1
          } -ArgumentList $PWD

          # 3. .minecraft 下载+解压 (后台)
          $mcJob = Start-Job -ScriptBlock {
            param($workDir, $ghToken)
            $env:GH_TOKEN = $ghToken
            Set-Location $workDir
            gh release download v1.0-assets --pattern "minecraft.7z" --output minecraft.7z --clobber 2>&1
            7z x minecraft.7z -odist\ -y 2>&1
            Remove-Item minecraft.7z 2>&1
          } -ArgumentList $PWD, $env:GH_TOKEN

          # 4. NuGet restore (后台)
          $restoreJob = Start-Job -ScriptBlock {
            param($workDir)
            Set-Location $workDir
            dotnet restore src/Baihe.Host/Baihe.Host.csproj -p:PublishReadyToRun=true 2>&1
          } -ArgumentList $PWD

          # 5. 在线安装器构建 (后台) — 注入 AppVersionOverride=tag全值，使测试在线安装器走测试通道
          $onlineJob = Start-Job -ScriptBlock {
            param($workDir, $onlineToken, $appVerOverride)
            Set-Location $workDir
            if (-not [string]::IsNullOrEmpty($onlineToken)) {
              dotnet publish src/Baihe.OnlineInstaller/Baihe.OnlineInstaller.csproj -c Release -o dist\online --nologo -p:OnlineToken=$onlineToken -p:AppVersionOverride=$appVerOverride 2>&1
            } else {
              dotnet publish src/Baihe.OnlineInstaller/Baihe.OnlineInstaller.csproj -c Release -o dist\online --nologo -p:AppVersionOverride=$appVerOverride 2>&1
            }
          } -ArgumentList $PWD, $env:BAIHE_ONLINE_TOKEN, $tagNoV

          # 6. 前端构建 (前台)
          Write-Host '--- Building frontend ---'
          Set-Location src/Baihe.UI
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build
          Set-Location ../..

          Write-Host '--- Waiting for background jobs ---'
          $jobs = @($jreJob, $wv2Job, $mcJob, $restoreJob, $onlineJob)
          Wait-Job -Job $jobs

          foreach ($job in $jobs) {
            $name = switch ($job.Id) {
              $jreJob.Id      { 'JRE build' }
              $wv2Job.Id      { 'WebView2 download' }
              $mcJob.Id       { '.minecraft download' }
              $restoreJob.Id  { 'NuGet restore' }
              $onlineJob.Id   { 'Online installer build' }
              default         { 'Unknown' }
            }
            Write-Host "--- $name output ---"
            Receive-Job $job | ForEach-Object { Write-Host $_ }
            if ($job.State -eq 'Failed') {
              throw "$name failed"
            }
            Remove-Job $job -Force
          }
          Write-Host '=== Parallel preparation complete ==='

      # ===== 发布后端 =====
      # FileVersion = 基础版.序号（如 1.1.26.1）：纯数值合法；同族 test 包之间可比较且高于旧正式版
      - name: Publish Baihe.Host
        env:
          BAIHE_ONLINE_TOKEN: ${{ secrets.BAIHE_ONLINE_TOKEN }}
        run: |
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          $baseVersion = $tagNoV -replace '-test.*$', ''
          $testSeq = '0'
          if ($tagNoV -match '-test\.?(\d+)$') { $testSeq = $Matches[1] }
          $fileVersion = "$baseVersion.$testSeq"
          Write-Host "Publishing TEST version: tag=$tagNoV fileVersion=$fileVersion"
          if (-not [string]::IsNullOrEmpty($env:BAIHE_ONLINE_TOKEN)) {
            dotnet publish src/Baihe.Host/Baihe.Host.csproj `
              -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=false `
              -p:PublishReadyToRun=true `
              -p:PublishTrimmed=false `
              -p:AssemblyVersion=$fileVersion `
              -p:FileVersion=$fileVersion `
              -p:OnlineToken=$env:BAIHE_ONLINE_TOKEN `
              -p:AppVersionOverride=$tagNoV `
              -p:ChannelOverride=test `
              -o dist\launcher -m --no-restore
          } else {
            dotnet publish src/Baihe.Host/Baihe.Host.csproj `
              -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=false `
              -p:PublishReadyToRun=true `
              -p:PublishTrimmed=false `
              -p:AssemblyVersion=$fileVersion `
              -p:FileVersion=$fileVersion `
              -p:AppVersionOverride=$tagNoV `
              -p:ChannelOverride=test `
              -o dist\launcher -m --no-restore
          }

      # ===== 复制附加资源 =====
      - name: Copy installer resources
        run: |
          Copy-Item installer_resources\icon.ico dist\launcher\ -Force
          Copy-Item fabric-installer.jar dist\launcher\ -Force

      # ===== 增量更新支持：清单(必产) + 相对上一测试版的差量补丁(可能跳过) =====
      # 上一版检索范围 = 预发布(test 渠道);失败仅告警,不影响本测试包发布
      - name: Generate update manifest & patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path .temp | Out-Null
          $prevFound = $false
          try {
            $rels = gh api 'repos/pkoiuu/mcbh/releases?per_page=30' --jq '.[] | select(.draft == false)' | ConvertFrom-Json
            foreach ($r in @($rels)) {
              if ($r.prerelease -ne $true) { continue }
              if ($r.tag_name -eq "${{ github.ref_name }}") { continue }
              $hasM = @($r.assets | Where-Object { $_.name -like 'BaiheManifest_*.json' }).Count -gt 0
              if (-not $hasM) { continue }
              Write-Host "Prev test manifest found on: $($r.tag_name)"
              gh release download $r.tag_name --pattern 'BaiheManifest_*.json' --dir .temp --clobber
              $prevFound = $true
              break
            }
          } catch { Write-Host "WARN: search prev releases failed: $_" }
          # 组合树: launcher 根文件 + .minecraft 子树
          Remove-Item -Recurse -Force .temp\patch_stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path .temp\patch_stage | Out-Null
          Copy-Item dist\launcher\* .temp\patch_stage\ -Recurse -Force
          if (Test-Path dist\.minecraft) { Copy-Item dist\.minecraft .temp\patch_stage\.minecraft -Recurse -Force }
          $argPrev = ''
          if ($prevFound) {
            $pm = Get-ChildItem .temp -Filter 'BaiheManifest_*.json' | Select-Object -First 1
          }
          $genArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/generate-update-patch.ps1',
            '-CurrentDir', '.temp/patch_stage',
            '-Version', $tagNoV,
            '-OutputDir', 'dist'
          )
          if ($pm) { $genArgs += @('-PrevManifestPath', $pm.FullName) }
          & pwsh @genArgs
          $code = $LASTEXITCODE
          Write-Host "generate-update-patch exit code: $code (0=patch produced, 2=manifest-only)"
          Remove-Item -Recurse -Force .temp\patch_stage -ErrorAction SilentlyContinue
          # 归一化: 2 = 设计内的 manifest-only,不算步骤失败
          if ($code -eq 2) { exit 0 } else { exit $code }

      # ===== 编译 Inno Setup 安装包 =====
      - name: Build installer with Inno Setup
        run: |
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          $baseVersion = $tagNoV -replace '-test.*$', ''
          Write-Host "Building installer display version: $baseVersion (asset keeps full tag $tagNoV)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$baseVersion installer\baihe_installer.iss

      # ===== 资产命名（保留完整 tag 后缀以区分多个测试包）=====
      - name: Name artifacts with full test tag
        run: |
          $tagNoV = "${{ github.ref_name }}" -replace '^v', ''
          $baseVersion = $tagNoV -replace '-test.*$', ''
          # Inno 按 /DMyAppVersion=$baseVersion 输出 dist\BaiheServer_Setup_v<base>.exe → 重命名为带 -test 后缀的唯一资产名
          Move-Item "dist\BaiheServer_Setup_v$baseVersion.exe" "dist\BaiheServer_Setup_v$tagNoV.exe" -Force
          Copy-Item dist\online\BaiheOnlineSetup.exe "dist\BaiheOnlineSetup_v$tagNoV.exe" -Force
          Get-ChildItem dist\*test*.exe | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      # ===== 上传到 GitHub Releases（prerelease 标记 = 稳定通道不可见）=====
      - name: Upload test artifacts to Prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/BaiheServer_Setup_v*-test*.exe
            dist/BaiheOnlineSetup_v*-test*.exe
            dist/BaiheManifest_v*-test*.json
            dist/BaihePatch_v*-test*.zip
          generate_release_notes: true
          body: |
            ## ⚠️ 内部测试构建 — ${{ github.ref_name }}

            > 本 Release 为**预发布**：主程序自动更新与官方在线安装器均不会向普通玩家推送此版本。
            > 仅限内部测试使用。测试完成后请安装正式版或等待下一个正式 Release。

            ### 下载说明
            - `BaiheOnlineSetup_v*-test*.exe`（约 40KB）：运行后自动经加速线路下载对应版本的测试完整包
            - `BaiheServer_Setup_v*-test*.exe`：完整离线安装包（内置游戏）

            ### 已知边界
            - 与正式版共用同一安装目录/AppId，安装会覆盖现有正式版（用于固定测试机时属预期行为）
            - 若之后发布了同基础版本号的正式版（如本包为 v1.1.26-testN、正式为 v1.1.26），
              测试机的启动器可能不会弹正式版更新横幅（FileVersion 相对关系），手动重装一次即可
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
